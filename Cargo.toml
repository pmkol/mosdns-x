[package]
name = "mosdns-x"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["pmkol"]
description = "A DNS forwarder written in Rust"
license = "GPL-3.0"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# DNS handling
trust-dns-proto = "0.23"
trust-dns-resolver = "0.23"
trust-dns-client = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP/HTTPS server
axum = { version = "0.7", features = ["http2"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = "0.1"
http = "1.0"

# TLS
rustls = { version = "0.22", features = ["ring"] }
rustls-pemfile = "2.0"
tokio-rustls = "0.25"

# QUIC / HTTP3
quinn = "0.10"
h3 = "0.0.3"
h3-quinn = "0.0.5"

# Metrics
prometheus = "0.13"

# Caching
dashmap = "5.5"
moka = { version = "0.12", features = ["future"] }

# Utilities
bytes = "1.5"
futures = "0.3"
arc-swap = "1.7"
once_cell = "1.19"

# IP/Network
ipnet = "2.9"

# Time
chrono = "0.4"

# Regex
regex = "1.10"

# Proxy Protocol
proxy-protocol = "0.5"

# Async trait
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
